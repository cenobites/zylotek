[package]
name = "zylotek"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
rust-version = "1.99.0"

[dependencies]

[workspace]
resolver = "3"
members = [
    "crates/zylotek-cli",
    "crates/zylotek-sync",
    "crates/zylotek-domain",
    "crates/zylotek-application",
    "crates/zylotek-infrastructure",
    "crates/zylotek-api",
    "crates/zylotek-contracts",
    "crates/zylotek-assistant",
    "crates/zylotek-webapp",
    "crates/zylotek-config",
]
# cargo-fuzz targets need nightly and libFuzzer; they live in their own workspace.
exclude = ["fuzz"]

[workspace.dependencies]
zylotek-domain = { path = "crates/zylotek-domain" }
zylotek-cli = { path = "crates/zylotek-cli" }
zylotek-contracts = { path = "crates/zylotek-contracts" }
zylotek-api = { path = "crates/zylotek-api" }
zylotek-assistant = { path = "crates/zylotek-assistant" }
zylotek-webapp = { path = "crates/zylotek-webapp" }
zylotek-sync = { path = "crates/zylotek-sync" }
zylotek-config = { path = "crates/zylotek-config" }
zylotek-application = { path = "crates/zylotek-application" }
# Without default features so clients can take `logging` alone; crates that use the database
# ask for the `persistence` feature.
zylotek-infrastructure = { path = "crates/zylotek-infrastructure", default-features = false }
log = "0.4.35"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures = "0.3.34"
trait-variant = "0.1.3"
async-trait = "0.1.92"
tokio = { version = "1.54.1", features = ["full"] }
reqwest = { version = "0.13.5", default-features = false, features = [
    "native-tls",
] }
scraper = { version = "0.29.0" }
anyhow = "1.0.104"
thiserror = "2.0.21"
csv = "1.4.0"
uuid = { version = "1.29.1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
axum = { version = "0.8.9", features = ["macros", "tracing"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.7.1", features = [
    "cors",
    "trace",
    "compression-gzip",
    "timeout",
    "limit",
] }
tracing = { version = "0.1.44", features = ["log"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json", "time"] }
toasty = { version = "0.11.0", features = ["sqlite", "serde"] }
toasty-cli = { version = "0.11.0" }
toasty-driver-sqlite = "0.11.0"

jsonwebtoken = { version = "11.1.0", default-features = false, features = ["use_pem", "rust_crypto"] }
argon2 = "0.6.0"
ed25519-dalek = { version = "3.0.0", features = ["pkcs8", "pem", "rand_core"] }
base64 = "0.23.1"
getrandom = { version = "0.4.3", features = ["sys_rng"] }
percent-encoding = "2.3"
askama = "0.16.1"
form_urlencoded = "1.2"


# Test-only dependencies.
assert_cmd = "2.2.2"
criterion = { version = "0.8.2", features = ["async_tokio"] }
http-body-util = "0.1.5"
insta = { version = "1.49.0", features = ["json", "redactions"] }
predicates = "3.1.4"
proptest = "1.12.0"
tempfile = "3.27.0"
wiremock = "0.6.5"

[workspace.lints.clippy]
unwrap_used = "warn"         # Prefer ? or expect("reason")
dbg_macro = "deny"           # No dbg!() in committed code
todo = "warn"                # Track incomplete implementations
large_enum_variant = "warn"  # Catch accidental size bloat

[workspace.lints.rust]
unsafe_code = "deny"         # Enforce zero-unsafe policy
# missing_docs = "warn"        # Encourage documentation

# Password hashing is deliberately slow; unoptimized it makes every test that touches a client
# secret take seconds, so build the hash and its digest at full speed even in dev and test.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# Default release profile — production-ready optimizations
[profile.release]
# Maximum optimization level for performance
opt-level = 3
# Enable Link-Time Optimization for smaller binary and better inlining
lto = "fat"
# Single codegen unit for maximum optimization (slower build, faster binary)
codegen-units = 1
# Strip symbols to reduce binary size
strip = "symbols"
# Abort on panic (no unwinding overhead, smaller binary)
panic = "abort"
# Enable debug assertions in release for extra safety (can disable if needed)
debug-assertions = false
# Overflow checks disabled for performance (enable if paranoid)
overflow-checks = false

# Production profile — maximum performance and smallest binary
[profile.production]
inherits = "release"
# Fat LTO for best cross-crate optimization
lto = "fat"
# Single codegen unit
codegen-units = 1
# Strip all symbols
strip = "symbols"
# Don't embed runtime library paths
rpath = false
# Disable incremental compilation (cleaner builds)
incremental = false
# Abort on panic
panic = "abort"
# Disable debug info
debug = false
# Enable frame pointers for production profiling with perf
# Comment out if binary size is critical
# frame-pointer = "always"

# Release with debug info — for profiling in production-like conditions
[profile.release-with-debug]
inherits = "release"
# Keep debug info for profiling/debugging
debug = true
# Keep symbols for symbolication
strip = "none"
