[package]
name = "zylotek"
version = "0.1.0"
edition = "2024"

[dependencies]

[workspace]
resolver = "3"
members = [
    "crates/zylotek-cli",
    "crates/zylotek-sync",
    "crates/zylotek-domain",
    "crates/zylotek-application",
    "crates/zylotek-infrastructure",
    "crates/zylotek-api",
    "crates/zylotek-contracts",
]
# cargo-fuzz targets need nightly and libFuzzer; they live in their own workspace.
exclude = ["fuzz"]

[workspace.dependencies]
zylotek-domain = { path = "crates/zylotek-domain" }
zylotek-cli = { path = "crates/zylotek-cli" }
zylotek-contracts = { path = "crates/zylotek-contracts" }
zylotek-api = { path = "crates/zylotek-api" }
zylotek-sync = { path = "crates/zylotek-sync" }
zylotek-application = { path = "crates/zylotek-application" }
zylotek-infrastructure = { path = "crates/zylotek-infrastructure" }
log = "0.4.34"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures = "0.3.34"
trait-variant = "0.1.3"
async-trait = "0.1.92"
tokio = { version = "1.53.2", features = ["full"] }
reqwest = { version = "0.13.5", default-features = false, features = [
    "native-tls",
] }
scraper = { version = "0.27.0" }
anyhow = "1.0.104"
thiserror = "2.0.21"
csv = "1.4.0"
uuid = { version = "1.27.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
axum = { version = "0.8.9", features = ["macros", "tracing"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = [
    "cors",
    "trace",
    "compression-gzip",
    "timeout",
    "limit",
] }
tracing = { version = "0.1.44", features = ["log"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json", "time"] }
toasty = { version = "0.11.0", features = ["sqlite", "serde"] }
toasty-cli = { version = "0.11.0" }
toasty-driver-sqlite = "0.11.0"

jsonwebtoken = { version = "11.1.0", default-features = false, features = ["use_pem", "rust_crypto"] }
argon2 = "0.6.0"
ed25519-dalek = { version = "3.0.0", features = ["pkcs8", "pem", "rand_core"] }
base64 = "0.23.1"
getrandom = { version = "0.4.3", features = ["sys_rng"] }
percent-encoding = "2.3"


# Test-only dependencies.
assert_cmd = "2.2.2"
criterion = { version = "0.8.2", features = ["async_tokio"] }
http-body-util = "0.1.5"
insta = { version = "1.49.0", features = ["json", "redactions"] }
predicates = "3.1.4"
proptest = "1.12.0"
tempfile = "3.27.0"
wiremock = "0.6.5"

# Password hashing is deliberately slow; unoptimized it makes every test that touches a client
# secret take seconds, so build the hash and its digest at full speed even in dev and test.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
