# Sample Zylotek configuration. Copy to `.env.toml` (or `.env.<name>.toml` and run with
# ZYLOTEK_ENV=<name>). Every key is optional; the values below are the defaults, and keys that
# are commented out have no default. Flags and ZYLOTEK_* variables override this file.

[database]
# Database the API serves from and `sync` writes to (`sqlite::memory:` for a throwaway one).
# Env: ZYLOTEK_DATABASE_URL
url = "sqlite:zylotek.db"

[oauth]
# Ed25519 private key (PKCS#8 PEM) that signs access tokens.
# Env: ZYLOTEK_OAUTH_SIGNING_KEY
# signing_key = "zylotek-oauth-key.pem"

# JSON file of the clients allowed to ask for tokens.
# Env: ZYLOTEK_OAUTH_CLIENTS
# clients = "zylotek-oauth-clients.json"

# The `iss` of access tokens and the base URL of the OAuth endpoints.
# Env: ZYLOTEK_OAUTH_ISSUER
# issuer = "http://localhost:8080"

[api]
# Base URL the assistant and the web app reach zylotek-api at.
# Env: ZYLOTEK_API_URL
url = "http://localhost:8080"

# Address the API listens on.
# Env: ZYLOTEK_API_LISTEN
listen = "127.0.0.1:8080"

[assistant]
# Base URL of the assistant, as the web app reaches it.
# Env: ZYLOTEK_ASSISTANT_URL
url = "http://localhost:8090"

# Address the assistant listens on.
# Env: ZYLOTEK_ASSISTANT_LISTEN
listen = "127.0.0.1:8090"

# Base URL of an OpenAI-compatible model server, such as Ollama.
# Env: ZYLOTEK_MODEL_URL
model_url = "http://localhost:11434"

# Model name sent with each request (a model you have pulled with `ollama pull`).
# Env: ZYLOTEK_MODEL_NAME
model_name = "qwen2.5:3b"

# API key for the model server, if it wants one. Keep this file out of git.
# Env: ZYLOTEK_MODEL_API_KEY
# model_api_key = "change-me"

# Bearer token callers must send to /v1/ask; the web app sends the same one.
# Env: ZYLOTEK_ASSISTANT_TOKEN
# token = "change-me"

# Seconds between catalogue syncs (at least 1).
# Env: ZYLOTEK_ASSISTANT_REFRESH_SECS
refresh_secs = 300

# How many woods an answer lists (1 to 50).
top = 5

[webapp]
# Address the website listens on.
# Env: ZYLOTEK_WEBAPP_LISTEN
listen = "127.0.0.1:3000"

# The OAuth client the website opens asks with. Create it with
# `zylotek-cli auth client create webapp --scope asks:write` and put the printed secret here.
# Env: ZYLOTEK_WEBAPP_API_CLIENT_ID, ZYLOTEK_WEBAPP_API_CLIENT_SECRET
# api_client_id = "webapp"
# api_client_secret = "change-me"
