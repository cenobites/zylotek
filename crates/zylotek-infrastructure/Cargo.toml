[package]
name = "zylotek-infrastructure"
version = "0.1.0"
edition = "2024"

[features]
default = ["persistence"]
# The database layer (toasty/SQLite and the domain mappings). Services that only need
# `logging` or the event bus, such as the web app and the assistant, turn it off.
persistence = [
    "dep:zylotek-domain",
    "dep:toasty",
    "dep:toasty-cli",
    "dep:toasty-driver-sqlite",
    "dep:uuid",
]
# A recording `EventPublisher` and an in-memory database for other crates' tests.
testing = ["persistence"]

[dependencies]
zylotek-domain = { workspace = true, optional = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
log = { workspace = true }
uuid = { workspace = true, optional = true }
toasty = { workspace = true, optional = true }
toasty-cli = { workspace = true, optional = true }
toasty-driver-sqlite = { workspace = true, optional = true }

[dev-dependencies]
# Enables the `testing` feature for this crate's own benches and integration tests.
zylotek-infrastructure = { path = ".", features = ["testing"] }
zylotek-domain = { workspace = true, features = ["testing"] }
criterion = { workspace = true }
serde_json = { workspace = true }
proptest = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true

[[bench]]
name = "repository"
harness = false
