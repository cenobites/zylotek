[package]
name = "zylotek-api"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "zylotek-api"
path = "src/main.rs"

[dependencies]
zylotek-domain = { workspace = true }
zylotek-infrastructure = { workspace = true, features = ["persistence"] }
zylotek-application = { workspace = true }
zylotek-contracts = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true}
anyhow = { workspace = true }
tracing = { workspace = true }
log = { workspace = true }
clap = { workspace = true }
jsonwebtoken = { workspace = true }
argon2 = { workspace = true }
ed25519-dalek = { workspace = true }
base64 = { workspace = true }
getrandom = { workspace = true }
percent-encoding = { workspace = true }

[features]
# An always-on `Auth` and a valid write token for other crates' tests, benches and fuzz targets.
testing = []

[dev-dependencies]
tempfile = { workspace = true }
zylotek-api = { path = ".", features = ["testing"] }
zylotek-domain = { workspace = true, features = ["testing"] }
zylotek-infrastructure = { workspace = true, features = ["testing"] }
criterion = { workspace = true }
http-body-util = { workspace = true }
insta = { workspace = true }
proptest = { workspace = true }
reqwest = { workspace = true }

[[bench]]
name = "http"
harness = false
