[package]
name = "zylotek-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "zylotek-cli"
path = "src/main.rs"

[dependencies]
zylotek-domain = { workspace = true }
zylotek-application = { workspace = true }
zylotek-infrastructure = { workspace = true, features = ["persistence"] }
zylotek-api = { workspace = true }
zylotek-sync = { workspace = true }
log = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
zylotek-domain = { workspace = true, features = ["testing"] }
assert_cmd = { workspace = true }
serde_json = { workspace = true }
predicates = { workspace = true }
tempfile = { workspace = true }
wiremock = { workspace = true }

[lints]
workspace = true
