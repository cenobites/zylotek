<style>
:root{--bg:#fbf8f3;--fg:#2b2118;--muted:#6f6254;--line:#e3d9cb;--card:#fff;--accent:#8a4b1f;--accent-fg:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#1c1712;--fg:#f1e8dc;--muted:#a99a88;--line:#3a3128;--card:#251f18;--accent:#d08a4e;--accent-fg:#1c1712}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,sans-serif}
header,main,footer{max-width:62rem;margin:0 auto;padding:1rem}
header{display:flex;gap:1.25rem;align-items:baseline;flex-wrap:wrap;border-bottom:1px solid var(--line)}
header a{color:var(--fg);text-decoration:none}header .langs{margin-left:auto}header .brand{font-weight:700;font-size:1.25rem}
a{color:var(--accent)}
h1{font-size:1.6rem;margin:1rem 0 .5rem}h2{font-size:1.2rem;margin:1.5rem 0 .5rem}
textarea,button{font:inherit;border-radius:.5rem;border:1px solid var(--line);padding:.6rem .8rem}
textarea{width:100%;min-height:6rem;background:var(--card);color:var(--fg)}
button,.button{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);cursor:pointer;text-decoration:none;display:inline-block}
.card{background:var(--card);border:1px solid var(--line);border-radius:.75rem;padding:1rem;margin:.75rem 0}
.muted{color:var(--muted)}.err{color:#b3261e}
table{border-collapse:collapse;width:100%;background:var(--card)}
th,td{border:1px solid var(--line);padding:.4rem .6rem;text-align:left;vertical-align:top}
.scroll{overflow-x:auto}
.chips span{display:inline-block;border:1px solid var(--line);border-radius:1rem;padding:.1rem .7rem;margin:.15rem .25rem .15rem 0}
.bar{height:.4rem;background:var(--line);border-radius:.2rem;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
img.hero{max-width:100%;max-height:22rem;border-radius:.75rem}
.prose{white-space:pre-wrap}
.pager{display:flex;justify-content:space-between;margin:1rem 0}
.hero .lead{font-size:1.1rem;color:var(--muted);max-width:46rem}
.examples{display:flex;flex-wrap:wrap;gap:.5rem}
.examples button{background:var(--card);color:var(--fg);border-color:var(--line);text-align:left;flex:1 1 16rem}
.examples button:hover,.examples button:focus-visible{border-color:var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(16rem,1fr));gap:.75rem}
.tile{display:flex;flex-direction:column;gap:.25rem;margin:0;text-decoration:none;color:var(--fg)}
.tile:hover,.tile:focus-visible{border-color:var(--accent)}
.question{font-size:1.1rem;font-style:italic;color:var(--muted)}
/* While the page streams: the thinking panel until the ranking arrives, the writing note until the end. */
.spinner{display:inline-block;width:1em;height:1em;vertical-align:-.15em;border:.15em solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.thinking-title{margin:0 0 .5rem;font-weight:600}
.thinking ol{margin:0;padding-left:1.4rem}
.thinking li{opacity:0;animation:step-in .4s ease-out forwards;animation-delay:calc(var(--step) * 2.5s)}
@keyframes step-in{from{opacity:0;transform:translateY(.25rem)}to{opacity:1;transform:none}}
main:has(.results) .thinking,main:has(.done) .writing{display:none}
.prose::after{content:"▍";color:var(--accent);animation:blink 1s steps(2) infinite}
main:has(.done) .prose::after{content:none}
@keyframes blink{50%{opacity:0}}
.failed{border-color:#b3261e}
button.link{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;font-size:.9em}
/* The ask history: a drawer on the left that stays out of the way until the hamburger button
   slides it over the page. The script shows the button; without one there is no history. */
.sidebar{position:fixed;inset:0 auto 0 0;z-index:20;width:min(18rem,85vw);display:flex;flex-direction:column;gap:.5rem;padding:1rem .75rem;overflow-y:auto;background:var(--card);border-right:1px solid var(--line);transform:translateX(-100%);visibility:hidden;transition:transform .2s ease-out,visibility .2s}
body.sidebar-open .sidebar{transform:none;visibility:visible}
.sidebar[hidden]{display:none}
.sidebar h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:1rem .5rem .25rem}
.sidebar .new-question{text-align:center}
.history{list-style:none;margin:0;padding:0}
.history li{display:flex;align-items:center;border-radius:.5rem}
.history li:hover,.history li.active{background:var(--line)}
.history a{flex:1;min-width:0;padding:.4rem .5rem;color:var(--fg);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.history .remove{background:none;border:0;color:var(--muted);padding:.2rem .5rem;opacity:0}
.history li:hover .remove,.history li.active .remove,.history .remove:focus-visible{opacity:1}
.sidebar [data-history-empty]{margin:.25rem .5rem;font-size:.9rem}
.sidebar-foot{margin-top:auto;padding:.5rem;font-size:.85rem}.sidebar-foot p{margin:.5rem 0 0}
.sidebar-toggle{background:none;color:var(--fg);border-color:var(--line);padding:.2rem .6rem;font-size:1.1rem;line-height:1.2}
.sidebar-toggle[hidden]{display:none}
.sidebar-backdrop{display:none}
body.sidebar-open .sidebar-backdrop{display:block;position:fixed;inset:0;z-index:19;background:rgb(0 0 0 / .4)}
/* A wood opens in a drawer over the answer, so the answer is never reloaded. */
.peek{font-weight:600}
.drawer{position:fixed;inset:0;z-index:10;display:flex;justify-content:flex-end;visibility:hidden;pointer-events:none}
.drawer:target{visibility:visible;pointer-events:auto}
.drawer .backdrop{position:absolute;inset:0;background:rgb(0 0 0 / .4);opacity:0;transition:opacity .2s}
.drawer:target .backdrop{opacity:1}
.sheet{position:relative;display:flex;flex-direction:column;width:min(40rem,100%);height:100%;background:var(--bg);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .25s ease-out}
.drawer:target .sheet{transform:none}
.sheet-bar{display:flex;gap:1rem;align-items:baseline;flex-wrap:wrap;padding:.75rem 1rem;border-bottom:1px solid var(--line)}
.sheet-bar .close{margin-left:auto}
.sheet iframe{flex:1;width:100%;border:0;background:var(--bg)}
body.embed main{max-width:none;padding-top:0}
@media (prefers-reduced-motion:reduce){.sidebar{transition:none}.spinner,.prose::after{animation:none}.thinking li{animation:none;opacity:1}.sheet,.drawer .backdrop{transition:none}}
</style>
