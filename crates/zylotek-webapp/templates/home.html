{% extends "base.html" %}
{% block title %}{{ t.home_title }}{% endblock %}
{% block content %}
<h1>{{ t.home_heading }}</h1>
<p class="muted">{{ t.home_intro }}</p>
<form method="post" action="/ask">
<textarea name="question" maxlength="1000" required placeholder="{{ t.home_placeholder }}">{{ question }}</textarea>
{% if let Some(error) = error %}<p class="err">{{ error }}</p>{% endif %}
<p><button type="submit">{{ t.home_submit }}</button></p>
</form>
{% endblock %}
