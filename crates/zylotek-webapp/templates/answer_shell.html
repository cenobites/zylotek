<!doctype html>
<html lang="{{ t.html_lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ t.answer_title }} · Zylotek</title>
{% include "style.html" %}
<script src="/static/history.js" defer></script>
</head>
<body>
{% include "nav.html" %}
<div class="layout">
{% include "sidebar.html" %}
<main class="answer" data-question="{{ question }}">
<h1>{{ t.answer_heading }}</h1>
<p class="question">“{{ question }}”</p>
<div class="thinking card" role="status" aria-live="polite">
<p class="thinking-title"><span class="spinner" aria-hidden="true"></span> {{ t.thinking }}</p>
<ol>
{% for step in t.thinking_steps %}<li style="--step:{{ loop.index0 }}">{{ step }}</li>
{% endfor %}</ol>
</div>
