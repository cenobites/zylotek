<aside class="invisible fixed inset-y-0 left-0 z-20 flex w-[min(19rem,85vw)] -translate-x-full flex-col gap-1 overflow-y-auto border-r border-line bg-card p-3 shadow-2xl shadow-black/10 transition-[transform,visibility] duration-250 ease-out group-data-[sidebar=open]/body:visible group-data-[sidebar=open]/body:translate-x-0 motion-reduce:transition-none" id="sidebar" data-sidebar hidden aria-label="{{ t.history_heading }}">
<div class="mb-2 flex items-center gap-2 px-1 py-1 font-serif text-lg font-semibold"><svg class="icon size-5 text-accent"><use href="#i-logo"/></svg>Zylotek</div>
<a class="btn w-full" href="/">+ {{ t.history_new }}</a>
<h2 class="eyebrow mx-2 mt-5 mb-1 flex items-center gap-1.5 font-sans"><svg class="icon"><use href="#i-clock"/></svg>{{ t.history_heading }}</h2>
<ul class="m-0 list-none space-y-0.5 p-0 text-sm" data-history-list data-remove="{{ t.history_remove }}"></ul>
<p class="mx-2 my-1 text-sm text-muted" data-history-empty>{{ t.history_empty }}</p>
<div class="mt-auto border-t border-line px-2 pt-3 text-xs">
<button type="button" class="link-btn text-xs" data-history-clear data-confirm="{{ t.history_clear_confirm }}" hidden>{{ t.history_clear }}</button>
<p class="mt-1.5 text-muted">{{ t.history_note }}</p>
</div>
</aside>
<div class="fixed inset-0 z-19 hidden bg-black/30 backdrop-blur-[2px] group-data-[sidebar=open]/body:block" data-sidebar-close></div>
