[package]
name = "zylotek-webapp"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "zylotek-webapp"
path = "src/main.rs"

[dependencies]
zylotek-contracts = { workspace = true }
zylotek-infrastructure = { workspace = true }
askama = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
log = { workspace = true }
clap = { workspace = true }
zylotek-config = { workspace = true }
form_urlencoded = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
zylotek-api = { workspace = true, features = ["testing"] }
zylotek-assistant = { workspace = true }
zylotek-domain = { workspace = true, features = ["testing"] }
zylotek-infrastructure = { workspace = true, features = ["testing"] }
assert_cmd = { workspace = true }
criterion = { workspace = true }
http-body-util = { workspace = true }
predicates = { workspace = true }
tower = { workspace = true }
wiremock = { workspace = true }

[lints]
workspace = true

[[bench]]
name = "render"
harness = false
