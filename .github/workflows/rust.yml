name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

# A newer push to the same branch or PR makes the older run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    - uses: Swatinem/rust-cache@v2
    - run: cargo fmt --all -- --check
    - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    - name: Unit tests
      run: make test-unit
    - name: Integration tests
      run: make test-integration
    - name: Doc tests
      run: cargo test --workspace --doc

  coverage:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: llvm-tools-preview
    - uses: Swatinem/rust-cache@v2
    - uses: taiki-e/install-action@cargo-llvm-cov
    - name: Unit coverage gate
      run: make cov-unit
    - name: Integration coverage gate (>= 80%)
      run: make cov-integration
    - name: Report
      run: cargo llvm-cov --workspace --tests --lcov --output-path lcov.info --ignore-filename-regex '(testing|test_support)\.rs|/tests/|/benches/|/src/main\.rs$'
    - uses: actions/upload-artifact@v4
      with:
        name: lcov
        path: lcov.info

  # Benchmarks are only run once here, to keep them compiling and working. Timings on shared
  # runners are too noisy to gate on; run `make bench` locally to compare.
  bench-smoke:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    - run: make bench-check

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@nightly
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: fuzz
    - run: cargo install cargo-fuzz --locked
    # parse_wood is expected to crash until the scraper's unwraps are removed (see
    # TESTING.md, "Known bugs"), so it is reported but does not fail the build.
    - name: Fuzz the stable targets
      run: make fuzz FUZZ_TIME=30 FUZZ_TARGETS="parse_open_data wood_request_json value_objects http_requests oauth_requests"
    - name: Fuzz the scraper
      continue-on-error: true
      run: make fuzz FUZZ_TIME=30 FUZZ_TARGETS="parse_wood"
    # `always()`: the scraper step above is allowed to fail, so `failure()` would never fire.
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: fuzz-artifacts
        path: fuzz/artifacts
        if-no-files-found: ignore
